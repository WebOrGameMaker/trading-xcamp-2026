[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-xcamp-2026"
version = "0.1.0"
description = "AI-powered stock trading system with ML predictions and paper trading"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.0,<3.0",
    "pyarrow>=15.0.0,<20.0",
    "scikit-learn>=1.4.0,<2.0",
    "xgboost>=2.0.0,<3.0",
    "lightgbm>=4.3.0,<5.0",
    "joblib>=1.3.0,<2.0",
    "pandas-ta>=0.3.14b",
    "vectorbt>=0.26.0,<1.0",
    "streamlit>=1.32.0,<2.0",
    "plotly>=5.19.0,<6.0",
    "yfinance>=0.2.40,<1.0",
    "alpaca-py>=0.21.0,<1.0",
    "pyyaml>=6.0.0,<7.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=4.1.0,<6.0",
    "ruff>=0.3.0,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
